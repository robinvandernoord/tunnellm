# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Header appears once at the top of the final changelog
header = """
# Changelog\n
"""

# Template rendered for each release
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
\n## [Unreleased]
{%- endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | capitalize }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

# Ensure an extra blank line between releases
footer = "\n"

[git]
# Parse conventional commits
conventional_commits = true
filter_unconventional = true
require_conventional = false

# Define commit groupings and filtering
commit_parsers = [
    { message = "^feat",     group = "🚀 Features" },
    { message = "^fix",      group = "🐛 Fixes" },
    { message = "^perf",     group = "⚡ Performance" },
    { message = "^refactor", group = "🧹 Refactor" },
    { message = "^style",    group = "🎨 Styling" },
    { message = "^docs?",    group = "📚 Documentation" },
    { message = "^test",     group = "🧪 Testing" },
    # skip noisy chores / ci / deps
    { message = "^chore",    skip = true },
    { message = "^ci",       skip = true },
    { message = "^build",    skip = true },
    { message = "^revert",   group = "⏪ Reverts" },
    { body = "(?i)security", group = "🛡️ Security" },
    # fallback for anything else conventional
    { message = ".*", group = "💼 Other" },
]

filter_commits = true
topo_order_commits = true
sort_commits = "oldest"